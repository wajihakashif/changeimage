
<!DOCTYPE html>
<html>
<head>
    <title>Change Image</title>

    <style>
        body {
            font-family: Arial;
            background-color: black;
            text-align: center;
            padding: 50px;
        }

        .container {
            background-color: white;
            padding: 30px;
            width: 400px;
            margin: auto;
            border-radius: 10px;
          
        }

        img {
            width: 250px;
            height: 200px;
            object-fit: cover;
            margin: 20px;
        }

        button {
            padding: 12px 25px;
            background-color: rgb(138, 21, 21);
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Change Image</h1>

        <img id="myImage"
        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRdmq0QmXf7MSHavqMQ4UbhkcOtaEtR8n4aYRluUA-lG2wL7zerGJfTpx0T&s=10">

        <br>

        <button onclick="changeImage()">
            Change Image
        </button>

    </div>

    <script>

        let imageNumber = 0;

        function changeImage() {

            if (imageNumber === 0) {

                document.getElementById("myImage").src =
                "https://static.vecteezy.com/system/resources/previews/054/571/540/non_2x/sunset-nature-free-photo.jpg";

                imageNumber = 1;

            } 
             else {

                document.getElementById("myImage").src =
                "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ-nMJe4I99kYqDH6XUuoj7zNCq712tIPYk2ZujXrfQjMEDkLg5G5ML8t8&s=10";

                imageNumber = 0;

            }

           
        }

    </script>

</body>
</html>
